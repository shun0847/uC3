<!--
このファイルはWebSocketクライアントが動作します。

<説明>

  以下のコードをへWebSocketサーバのIPアドレスを指定します。
    変更前) var url = 'wss://' + location.hostname;
    変更後) var url = 'wss://192.168.11.51';

  実行は、このファイルをダブルクリックしてWebで表示するか
  ファイルをWebブラウザへドラッグ＆ドロップします。

  Webで表示された時点でWebSocketサーバへ接続した状態となります。
  画面のテキストボックへ文字を入力し改行キーを押下しますと
  入力した文字がWebSocketサーバへ送信され、テキストボック下に表示されます。
  WebSocketサーバから受信した文字はテキストボックしたへ表示されます。
-->

<html>
    <head>
    </head>
    <body>
    <input type=text id='input'>
    <p>
    <label id='output'></label>

    <script>
       var url = 'wss://' + location.hostname;
       var sock = new WebSocket(url);
       var input = document.getElementById('input');
       var output = document.getElementById('output');
       input.addEventListener('keypress', function(e) {
            if (e.key == 'Enter') {
                sock.send(input.value);
                input.value = "";
            }
       });
        sock.addEventListener('message', function(e) {
            output.innerHTML = output.innerHTML + "<br>" + e.data;
        });
    </script>
    </body>
</html>
